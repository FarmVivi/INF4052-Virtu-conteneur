services:
  mongodb:
    image: mongodb/mongodb-community-server:7.0.23-ubi9
    container_name: td6-mongodb
    env_file: .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGODB_DATABASE}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - td6_db_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  webapp:
    image: webapp-2:latest
    container_name: td6-webapp
    depends_on:
      mongodb:
        condition: service_healthy
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  td6_db_data:
